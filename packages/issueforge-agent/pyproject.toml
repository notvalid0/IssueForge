[project]
name = "issueforge-agent"
version = "0.1.0"
description = "IssueForge local CUDA kernel optimization agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "issueforge-core",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.9",
]

[project.optional-dependencies]
cuda = ["torch>=2.1"]

[project.scripts]
issueforge-agent = "issueforge_agent.cli:main"
issueforge = "issueforge_agent.cli:main"

[tool.uv.sources]
issueforge-core = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
